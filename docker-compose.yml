version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: defacto_db
    environment:
      POSTGRES_USER: erp_admin
      POSTGRES_PASSWORD: erp_password
      POSTGRES_DB: defacto_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_admin -d defacto_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./defacto-backend
    container_name: defacto_backend
    ports:
      - "8080:8080"
    env_file:
      - ./defacto-backend/.env
    environment:
      - DATABASE_URL=postgresql://erp_admin:erp_password@db:5432/defacto_db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads_nvme

  frontend:
    build:
      context: ./defacto-frontend
    container_name: defacto_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads: