[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "defacto-ltm-sync-backend"
version = "0.3.4"
description = "Enterprise Multi-Tenant LTM Context Manager & Headless DAG Pipeline Engine (FastAPI, pgvector, BigQuery)"
readme = "../README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Namjin Kim" }
]
keywords = [
    "llmops",
    "fastapi",
    "pgvector",
    "rag",
    "bigquery",
    "pydantic-v2",
    "context-engineering",
    "multi-tenant"
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.3.2",
    "alembic>=1.13.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "google-genai>=1.0.0",
    "google-cloud-bigquery>=3.25.0",
    "Pillow>=10.4.0",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10.4",
    "tenacity>=8.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -q --strict-markers"
markers = [
    "unit: fast isolated unit tests without external network calls",
    "integration: database and pipeline integration tests",
]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    "__pycache__",
    "alembic/versions",
    "uploads_nvme",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
no_strict_optional = true
warn_unused_configs = true
exclude = ["alembic/versions/", "tests/"]

[tool.coverage.run]
source = ["services", "routers", "schemas", "database"]
omit = [
    "tests/*",
    "alembic/*",
    "seed.py",
    "inject_erp.py",
    "test_bq_search.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true